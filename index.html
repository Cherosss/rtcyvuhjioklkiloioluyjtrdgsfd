    <style>
        @keyframes movee {

       }
       @keyframes rotat {
            0%{transform: rotate(0deg);}
            
            100%{transform: rotate(720deg);}
        
       }
        .car{

        z-index: 20;

       .wheel{

        height: 80px;
        background-color: black;
        clip-path: circle();
        position: absolute;
        left: 145px; 
        bottom: -130px;
        z-index: 100;
       }
       .wheel2{
